[workspace]
members = ["crates/wgpu_sort", "crates/katara"]

resolver = "2"

[profile.release]
strip = true

[workspace.dependencies]
wgpu = { version = "29.0", default-features = false, features = ["webgpu"] }
bytemuck = { version = "1.2", features = [ "derive" ] }

env_logger = { version = "0.11", default-features = false }
log = "0.4"
