[package]
name = "katara"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "katara_engine"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0"
winit = "0.30"
env_logger = "0.10"
log = "0.4"
wgpu = "29.0"
pollster = "0.3"
bytemuck = { version = "1.2", features = [ "derive" ] }
cgmath = "0.18"
tobj = { version = "3.2", default-features = false, features = ["async"]}
instant = "0.1"

imgui = "0.12"
imgui-winit-support = "0.13"
imgui-wgpu = "0.28"

serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
reqwest = { version = "0.13" }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
