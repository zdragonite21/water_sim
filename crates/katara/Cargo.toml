[package]
name = "katara"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "katara_engine"
path = "src/main.rs"

[features]
default = ["native-vulkan"]
native-vulkan = ["wgpu/vulkan", "wgpu/wgsl"]
asset-loading = ["dep:image", "dep:tobj"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
env_logger = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
pollster = "0.3"
bytemuck = { workspace = true }
cgmath = "0.18"
tobj = { version = "3.2", default-features = false, features = ["async"], optional = true }
instant = "0.1"
rand = "0.10"
naga_oil = "0.2"
include-wgsl-oil = "0.2.9"
wgpu_sort = { path = "../wgpu_sort" }
profiling = { version = "1.0.18", features = ["profile-with-puffin"] }
wgpu-profiler = "0.27"

egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.35", default-features = false }
egui-wgpu = { version = "0.35", default-features = false }

serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
optional = true

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"

[lib]
crate-type = ["cdylib", "rlib"]
