[package]
name = "katara"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "katara_engine"
path = "src/main.rs"

[features]
default = ["native-vulkan"]
native-vulkan = ["wgpu/vulkan", "wgpu/wgsl"]
asset-loading = ["dep:image", "dep:tobj"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
env_logger = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
pollster = "0.3"
bytemuck = { workspace = true }
cgmath = "0.18"
tobj = { version = "3.2", default-features = false, features = ["async"], optional = true }
instant = "0.1"
rand = "0.10"
naga_oil = "0.2"
include-wgsl-oil = "0.2.9"
wgpu_sort = { path = "../wgpu_sort" }

imgui = "0.12"
imgui-winit-support = "0.13"
imgui-wgpu = "0.28"

serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
reqwest = { version = "0.13" }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"

[lib]
crate-type = ["cdylib", "rlib"]
